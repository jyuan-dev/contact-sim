[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-sim"
version = "0.1.0"
description = "Contact-Sim: Object-centric learning with Deformable SAVi and SAVi models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "hydra-core>=1.3.0",
    "omegaconf",
    "h5py",
    "numpy",
    "scipy",
    "pillow",
    "imageio",
    "matplotlib",
    "tensorboard",
    "scikit-learn",
    "scikit-image",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "third_party/slotformer/slotformer/base_slots",
]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::UserWarning",
]

