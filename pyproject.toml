[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "contact-sim"
version = "0.1.0"
description = "Contact-Sim: Object-centric learning with DETR and SAVi models"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
