[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-sim"
version = "0.1.0"
description = "Contact-Sim: Object-centric learning with SAVi and SlotFormer world models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "hydra-core>=1.3.0",
    "omegaconf",
    "h5py",
    "numpy",
    "scipy",
    "pillow",
    "imageio",
    "matplotlib",
    "tensorboard",
    "scikit-learn",
    "scikit-image",
    "jaxtyping",
    "beartype",
    "typeguard>=4",
    "typing_extensions",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
sweeps = [
    "hydra-optuna-sweeper",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pyright]
include = ["src"]
exclude = ["tests", "scripts", "third_party", "scratch", "outputs"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "third_party/slotformer/slotformer/base_slots",
]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::UserWarning",
]

