# Full PushT Slot-PIDM Configuration (18,685 Episodes)
dataset:
  name: "pusht"
  h5_path: "/home/jyuan/.stable-wm/pusht_expert_train_enriched.h5"
  resolution: [64, 64]
  train_frac: 0.9
  n_sample_frames: 6
  frame_offset: 1

model:
  d_model: 128
  action_dim: 2
  k_slots: 4
  num_heads: 4
  num_iterations: 2
  weight_action_loss: 1.0
  weight_slot_loss: 1.0
  weight_sigreg_loss: 0.01

training:
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 10
  warmup_epochs: 1
  seed: 42
  num_workers: 8
  log_interval: 50
  checkpoint_interval: 1
  save_dir: "scratch/checkpoints/slot_pidm_pusht_full"
