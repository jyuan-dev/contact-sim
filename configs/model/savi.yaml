# ==============================================================================
# Standard SAVi Model Configuration
# ==============================================================================
# Overview:
#   Configuration for standard SAVi (Slot Attention for Video), wrapping
#   StoSAVi with CNN encoder/decoder and temporal Slot Attention predictor module.
# ==============================================================================

name: "savi"                   # Model identifier string used in exp_name interpolation
type: "savi"                   # Registered decorator key in src.models.factory targeting StandardizedSAViWrapper

# ── Model Architecture Dimensions ─────────────────────────────────────────────
resolution: [64, 64]          # Spatial resolution [Height, Width] of input image frames
n_sample_frames: 6            # Number of temporal video frames per clip (T = 6)
num_slots: 4                  # Total number of latent object slots (K = 4)
num_iterations: 3             # Number of iterative Slot Attention refinement steps per frame
in_channels: 3                # Number of input image channels (3 for RGB)

# ── Slot Representation Parameters ───────────────────────────────────────────
slot_dict:
  num_slots: 4                # Total number of latent object slots (K = 4)
  slot_size: 64               # Vector dimensionality of each latent slot representation (D = 64)

# ── Normalization Parameters ──────────────────────────────────────────────────
use_encoder_bn: true          # Apply BatchNorm1d to encoder output features before Slot Attention
use_residual_bn: true         # Apply BatchNorm1d to slot states at the end of each residual update

# ── Latent Distribution Settings ─────────────────────────────────────────────
loss_dict:
  kld_method: "none"          # VAE KL divergence mode: 'none' (deterministic slots), 'analytic', or 'mc'

# ── Sub-Loss Weights (Fallback when loss module is not specified via Hydra) ───
weight_dict:
  match_mode: "fixed"         # Mask-to-slot matching strategy: 'fixed' (direct index order) or 'hungarian'
  recon: 1.0                  # Weight multiplier for image reconstruction MSE loss
  mask: 1.0                   # Weight multiplier for mask segmentation loss (BCE + Dice)
  sigreg: 0.0                 # Weight multiplier for SIGReg isotropic Gaussian regularization loss
