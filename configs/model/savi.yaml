# ==============================================================================
# Standard SAVi Model Configuration
# ==============================================================================
# Overview:
#   Configuration for standard SAVi (Slot Attention for Video), wrapping
#   StoSAVi with CNN encoder/decoder and temporal Slot Attention predictor.
# ==============================================================================

name: "savi"                   # Unique model name identifier
type: "savi"                   # Registered key in src.models.factory model registry

# ── Architectural Dimensions ──────────────────────────────────────────────────
resolution: [64, 64]          # Spatial image resolution [Height, Width] input to backbone
n_sample_frames: 6            # Number of temporal video frames per clip (T)
num_slots: 4                  # Number of latent object slot vectors (K)
num_iterations: 3             # Number of iterative Slot Attention refinement steps per frame
in_channels: 3                # Number of input RGB image channels (3 for RGB)

# ── Slot Representation Parameters ───────────────────────────────────────────
slot_dict:
  num_slots: 4                # Number of object slots (K)
  slot_size: 64               # Dimension of each slot feature vector (D)

# ── Latent Loss Settings ──────────────────────────────────────────────────────
loss_dict:
  kld_method: "none"          # VAE KL-divergence method: 'none', 'analytic', or 'mc'

# ── Default Sub-Loss Weights ──────────────────────────────────────────────────
weight_dict:
  match_mode: "fixed"         # Mask matching strategy: 'fixed' (direct index order) or 'hungarian'
  recon: 1.0                  # Weight coefficient for image reconstruction MSE loss
  mask: 1.0                   # Weight coefficient for mask segmentation loss (BCE + Dice)
  sigreg: 0.0                 # Weight coefficient for SIGReg latent regularization loss
