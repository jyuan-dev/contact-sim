# PIDM (Predictive Inverse Dynamics Model) Model Configuration
name: "pidm_slotformer"
type: "pidm_slotformer"

# Pretrained Frozen Stage 1 Slot Extractor
stage1_ckpt_path: "scratch/checkpoints/savi_pusht_default_4ep/savi_best.pt"
stage1_model_type: "savi"

# Spatial & Temporal Dimensions
resolution: [64, 64]
n_sample_frames: 6
history_len: 2
rollout_len: 4

# Goal-Conditioned Slot Rollouter Settings
condition_mode: "goal_film"      # 'goal_film', 'goal_cross_attn', or 'goal_sum'
goal_slot_idx: 2                 # Slot 2 is Goal Target Area in Push-T
d_model: 128
num_layers: 4
num_heads: 8
ffn_dim: 512
t_pe: "sin"
slots_pe: ""
loss_decay_factor: 1.0
use_img_recon_loss: false

# Inverse Dynamics Model (IDM) & Action Conditioning
raw_action_dim: 2
action_embed_dim: 64
robot_slot_idx: 0
rollout_consistent: true         # Jointly train over GT and rollout-predicted transitions

# Loss Balance Coefficients
slot_loss_weight: 1.0
action_loss_weight: 1.0

