# ==============================================================================
# SlotFormer Stage 2 (Transformer Rollouter) Model Configuration
# ==============================================================================
# Overview:
#   Configures SlotFormer Stage 2 Transformer Rollouter, wrapping a pre-trained
#   Stage 1 slot extractor (standard SAVi without SIGReg) with a 4-layer Transformer Encoder.
# ==============================================================================

name: "slotformer"
type: "slotformer"

# ── Stage 1 Pretrained Checkpoint Configuration ──────────────────────────────
stage1_ckpt_path: "scratch/checkpoints/savi_pusht/savi_best.pt"
stage1_model_type: "savi"

# ── Model Dimensions ──────────────────────────────────────────────────────────
resolution: [64, 64]
n_sample_frames: 6
history_len: 2
rollout_len: 4

# ── Transformer Rollouter Hyperparameters ────────────────────────────────────
d_model: 128
num_layers: 4
num_heads: 8
ffn_dim: 512
t_pe: "sin"
slots_pe: ""
loss_decay_factor: 1.0
use_img_recon_loss: false

