# ==============================================================================
# OCVP Factorized SlotFormer Stage 2 Model Configuration
# ==============================================================================
# Overview:
#   Configures OCVP-inspired Stage 2 Transformer Rollouter, featuring decoupled
#   Temporal Self-Attention (motion over T) and Interactive Self-Attention
#   (object interaction over K slots) sequentially connected per layer and iterated N times.
# ==============================================================================

name: "ocvp_slotformer"
type: "ocvp_slotformer"
rollouter_type: "ocvp"

# ── Stage 1 Pretrained Checkpoint Configuration ──────────────────────────────
stage1_ckpt_path: "scratch/checkpoints/savi_pusht_default_4ep/savi_best.pt"
stage1_model_type: "savi"

# ── Model Dimensions ──────────────────────────────────────────────────────────
resolution: [64, 64]
n_sample_frames: 6
history_len: 2
rollout_len: 4

# ── OCVP Rollouter Hyperparameters ───────────────────────────────────────────
d_model: 128
num_layers: 4
num_heads: 8
ffn_dim: 512
t_pe: "sin"
slots_pe: ""
loss_decay_factor: 1.0
use_img_recon_loss: false

# ── Sub-Loss Weights ─────────────────────────────────────────────────────────
weight_dict:
  slot_mse: 1.0
