# LeWorldModel (LeWM) Configuration
# ==============================================================================
# Overview:
#   Configuration for LeWorldModel (LeWM) — stable end-to-end Joint-Embedding
#   Predictive Architecture (JEPA) from raw pixels with SIGReg regularization.
# ==============================================================================

name: "lewm"
type: "lewm"

# ── Model Architecture Dimensions ─────────────────────────────────────────────
resolution: [64, 64]          # Spatial resolution [Height, Width] of input frames
in_channels: 3                # Image channel dimension (RGB = 3)
action_dim: 2                 # Control action vector dimension
embed_dim: 192                # Latent embedding dimensionality
hidden_dim: 2048              # Projector hidden dimension
n_sample_frames: 6            # Clip length per training sequence
num_frames: 16                # Max sequence length for positional encodings
num_preds: 1                  # Number of future steps to predict

# ── AR Predictor Transformer ──────────────────────────────────────────────────
predictor:
  depth: 6                    # Number of AdaLN-zero conditional transformer layers
  heads: 8                    # Number of attention heads
  dim_head: 64                # Per-head dimension
  mlp_dim: 1024               # FeedForward hidden dimension
  dropout: 0.1                # Dropout rate

# ── Loss & Regularization Settings ─────────────────────────────────────────────
loss:
  sigreg:
    weight: 0.09              # Weight of SIGReg ECF isotropic Gaussian regularization
    num_proj: 1024            # Number of random unit projections
    knots: 17                 # Number of quadrature knots
    t_max: 3.0                # Integration upper bound
