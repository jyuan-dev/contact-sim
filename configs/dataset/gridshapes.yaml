# ==============================================================================
# GridShapes Synthetic Dataset Configuration
# ==============================================================================
# Overview:
#   Configuration for GridShapes synthetic dataset, generating 2D geometric shapes
#   moving on a grid. Handled by GridShapesDataset in src.datasets.gridshapes.
# ==============================================================================

name: "gridshapes"            # Dataset identifier string used in exp_name interpolation
type: "gridshapes"            # Registered dataset type key targeting GridShapesDataset in src.datasets.factory
resolution: [64, 64]          # Image spatial resolution [Height, Width]
n_sample_frames: 16           # Number of temporal video frames per synthetic video sequence (T = 16)
num_objects: 3                # Number of distinct geometric objects per synthetic video
train_samples: 1000           # Total number of generated training video clips
val_samples: 200              # Total number of generated validation video clips
