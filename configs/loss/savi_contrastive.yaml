# SAVi Composite Loss with Temporal Contrastive Regularization (Hydra Instantiated)
_target_: src.losses.composite.CompositeLoss
losses:
  recon:
    _target_: src.losses.recon_loss.ReconstructionMSELoss
    weight: 1.0
  mask:
    _target_: src.losses.mask_loss.MaskSegmentationLoss
    weight: 1.0
    match_mode: fixed
  contrastive:
    _target_: src.losses.contrastive.TemporalSlotContrastiveLoss
    weight: 0.1
