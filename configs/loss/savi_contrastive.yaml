# ==============================================================================
# Composite Loss with Temporal Slot Contrastive Regularization Configuration
# ==============================================================================
# Overview:
#   Instantiates CompositeLoss (src.losses.composite.CompositeLoss) via Hydra.
#   Combines:
#     1. ReconstructionMSELoss (src.losses.recon_loss.ReconstructionMSELoss)
#     2. MaskSegmentationLoss (src.losses.mask_loss.MaskSegmentationLoss)
#     3. TemporalSlotContrastiveLoss (src.losses.contrastive.TemporalSlotContrastiveLoss) — InfoNCE across video timesteps
# ==============================================================================

_target_: src.losses.composite.CompositeLoss  # Target Python class to instantiate via hydra.utils.instantiate

losses:
  recon:
    _target_: src.losses.recon_loss.ReconstructionMSELoss # Atomic loss term for image reconstruction MSE
    weight: 1.0                                             # Loss weighting coefficient for reconstruction MSE
  mask:
    _target_: src.losses.mask_loss.MaskSegmentationLoss    # Atomic loss term for object mask segmentation (BCE + Dice)
    weight: 1.0                                             # Loss weighting coefficient for mask segmentation
    match_mode: fixed                                       # Slot-to-ground-truth mask assignment mode ('fixed' or 'hungarian')
  contrastive:
    _target_: src.losses.contrastive.TemporalSlotContrastiveLoss # Atomic loss term for temporal InfoNCE slot contrastive regularization
    weight: 0.1                                                   # Loss weighting coefficient for contrastive term (enforces slot tracking consistency)
