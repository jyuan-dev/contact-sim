# ==============================================================================
# Composite Loss with SIGReg Regularization Configuration
# ==============================================================================
# Overview:
#   Inherits base loss terms ('recon' and 'mask') from savi_default.yaml via Hydra defaults,
#   and appends SIGRegLoss (Sketched Isotropic Gaussian Regularization).
# ==============================================================================

defaults:
  - savi_default
  - _self_

losses:
  sigreg:
    _target_: src.losses.sigreg.SIGRegLoss                 # Atomic loss term for isotropic Gaussian latent regularization
    weight: 0.1                                             # Loss weighting coefficient for SIGReg term (prevents latent collapse)
