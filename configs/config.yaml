# ==============================================================================
# Main Hydra Experiment Configuration File (contact-sim)
# ==============================================================================
# Overview:
#   This is the root configuration file loaded by Hydra for training and evaluation.
#   It composes default settings from sub-directories (model/, dataset/, loss/)
#   and defines global training, optimization, hardware, and evaluation parameters.
#
# Common Usage Examples:
#   - Default training run (SAVi on PushT dataset):
#       python scripts/train.py
#   - Train standard SAVi model with SIGReg loss:
#       python scripts/train.py model=savi loss=savi_sigreg
#   - Train with custom batch size and learning rate:
#       python scripts/train.py batch_size=64 lr=1e-4
#   - Run 5-step dry-run sanity check:
#       python scripts/train.py dry_run=true
#   - Evaluate pre-trained checkpoint:
#       python scripts/eval.py ckpt_path=scratch/checkpoints/savi_pusht/savi_best.pt
# ==============================================================================

# ── 1. Hydra Defaults Composition Group ──────────────────────────────────────
# NOTE: `_self_` comes FIRST so this file's top-level keys are pure defaults:
# group configs (model/dataset/loss) and experiment configs override them.
# (Previously `_self_` was last, which silently shadowed experiment files.)
defaults:
  - _self_                     # Keys in this file are the lowest-precedence defaults
  - model: savi                # Model config from configs/model/
  - dataset: pusht             # Dataset config from configs/dataset/ ('pusht' or 'gridshapes')
  - loss: savi_default         # Loss composition config from configs/loss/ ('savi_default', 'savi_sigreg', 'savi_contrastive')
  - optional experiment: null  # Optional experiment override from configs/experiment/ (e.g. 'savi_pusht')

# ── 2. Experiment Identification & Reproducibility ───────────────────────────
exp_name: ${model.name}_${dataset.name} # Dynamic string defining experiment directory name under scratch/checkpoints/
seed: 42                                 # Global random seed set across PyTorch, CUDA, NumPy, and Python random

# ── 3. Optimization & Training Hyperparameters ──────────────────────────────
epochs: 8               # Total number of full training passes through dataset
batch_size: 128         # Mini-batch size per training step across all workers
num_workers: 8          # Number of DataLoader background worker processes for parallel data fetching
lr: 2e-4                # Initial learning rate for Adam/AdamW optimizer
weight_decay: 1e-4      # L2 weight decay penalty coefficient for AdamW optimizer
grad_clip_norm: 1.0     # Maximum allowed gradient norm (clips gradients to prevent exploding gradients)
scheduler: null         # Optional LR scheduler: 'cosine' (warmup + cosine decay) or null (constant LR)

# ── 4. Execution, Hardware & Debugging Settings ──────────────────────────────
dry_run: false          # Fast debug mode: if true, caps epoch at 5 batches and runs 1 epoch to verify pipeline
max_steps: null         # Global maximum training steps across all epochs (set integer to limit total steps, or null for unlimited)
ckpt_path: null         # File path to .pt checkpoint to resume training or evaluate (null = train from scratch)
use_amp: true           # Enable Automatic Mixed Precision (torch.cuda.amp) for FP16 accelerated execution on GPU
device: cuda            # Execution compute hardware device: 'cuda' (NVIDIA GPU) or 'cpu'

# ── 5. Evaluation & Benchmarking Settings ────────────────────────────────────
mode: deterministic     # Evaluation mode in scripts/eval.py: 'deterministic' (100% val coverage) or 'visualize' (renders GIFs)
clips_per_ep: 2         # Fixed number of deterministic clips sampled per validation episode in DeterministicEpisodeEvalDataset

# ── 6. Experiment Tracking & Logging Settings ────────────────────────────────
use_wandb: true         # Enable Weights & Biases experiment tracking by default
wandb_project: pusht-contact-sim # Default WandB project name
auto_dvc: true           # Automatically run `dvc add` on best checkpoint after training
