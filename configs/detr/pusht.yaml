# DETR PushT Baseline Configuration

model:
  name: "detr"
  type: "detr"
  num_queries: 5
  num_classes: 3
  d_model: 128
  nhead: 4
  num_encoder_layers: 3
  num_decoder_layers: 3
  dim_feedforward: 512
  train_backbone: false

# Data
h5_path: "/home/jyuan/.stable-wm/pusht_expert_train_enriched.h5"
resolution: [64, 64]
n_sample_frames: 6
frame_offset: 1
train_frac: 0.8

# Training Hyperparameters
epochs: 15
batch_size: 32
lr: 0.0001
clip_grad: 0.1

# Loss Weights
weight_dict:
  class: 1.0
  bbox: 5.0
  giou: 2.0
