# ==============================================================================
# OCVP Factorized SlotFormer Stage 2 PushT Experiment Configuration
# ==============================================================================

exp_name: "ocvp_slotformer_pusht_default_4ep"

dataset:
  load_masks: false

model:
  name: "ocvp_slotformer"
  type: "ocvp_slotformer"
  rollouter_type: "ocvp"
  stage1_ckpt_path: "scratch/checkpoints/savi_pusht_default_4ep/savi_best.pt"
  stage1_model_type: "savi"
  history_len: 2
  rollout_len: 4
  d_model: 128
  num_layers: 4
  num_heads: 8
  ffn_dim: 512

batch_size: 256
lr: 0.0004
weight_decay: 0.0
epochs: 4
val_every: 1
seed: 42
