# INTACT-Grounded Action-Conditioned OCVP PushT Experiment Config
exp_name: "ocvp_intact_slotformer_pusht_default_4ep"

dataset:
  load_masks: false

model:
  name: "ocvp_intact_slotformer"
  type: "ocvp_intact_slotformer"
  rollouter_type: "cocvp"
  stage1_ckpt_path: "scratch/checkpoints/savi_pusht_default_4ep/savi_best.pt"
  stage1_model_type: "savi"
  history_len: 2
  rollout_len: 4
  d_model: 128
  num_layers: 4
  num_heads: 8
  ffn_dim: 512
  raw_action_dim: 2
  action_embed_dim: 64
  condition_mode: "film"
  use_intact_actor: true
  action_loss_weight: 1.0
  robot_slot_idx: 0

batch_size: 256
lr: 0.0004
weight_decay: 0.0
epochs: 4
val_every: 1
seed: 42
